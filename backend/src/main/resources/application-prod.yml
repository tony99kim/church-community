spring:
  main:
    lazy-initialization: true
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      data-source-properties:
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      timeout: 2000ms
      ssl:
        enabled: true

supabase:
  url: ${SUPABASE_URL:https://mcdtxlcsbcxupzmkzjqd.supabase.co}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  bucket: church-community

management:
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

resilience4j:
  circuitbreaker:
    instances:
      notification:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true

logging:
  level:
    com.churchhub: INFO
    io.github.resilience4j: WARN
